<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านค้าเสื้อผ้า - หน้าหลัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }
        
        /* FlauntFit Brand Colors */
        .flauntfit-brand-color {
            background-color: #F6F;
        }
        .flauntfit-blue {
            background-color: #007bff;
        }
        .flauntfit-green {
            background-color: #28a745;
        }
        .flauntfit-red {
            background-color: #dc3545;
        }
        .flauntfit-pink {
            background-color: #FFC0CB; /* สีชมพู */
        }
        
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="flauntfit-pink text-white p-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-2xl font-bold" style="color:#9h'.lj]'wx9i'wso">FlauntFit</a>
                <div class="flex-grow">
                    <input type="text" placeholder="ค้นหาสินค้า" class="w-96 p-2 rounded-lg text-black">
                </div>
            </div>
            <nav>
                <a href="login.html" class="text-white hover:underline mr-4">เข้าสู่ระบบ</a>
                <a href="register.html" class="text-white hover:underline">สมัครสมาชิก</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 mt-8">
        <section class="mb-8">
            <h2 class="text-xl font-semibold mb-4">หมวดหมู่สินค้า</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Example Category Cards -->
                <div class="bg-white p-4 rounded-lg shadow-md text-center">
                    <img src="https://placehold.co/100x100/eeeeee/333333?text=แฟชั่นหญิง" alt="แฟชั่นผู้หญิง" class="mx-auto rounded-full">
                    <p class="mt-2 text-sm">เสื้อผ้าแฟชั่นผู้หญิง</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md text-center">
                    <img src="https://placehold.co/100x100/eeeeee/333333?text=แฟชั่นชาย" alt="แฟชั่นผู้ชาย" class="mx-auto rounded-full">
                    <p class="mt-2 text-sm">เสื้อผ้าแฟชั่นผู้ชาย</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md text-center">
                    <img src="https://placehold.co/100x100/eeeeee/333333?text=ชุดชั้นใน" alt="ชุดชั้นใน" class="mx-auto rounded-full">
                    <p class="mt-2 text-sm">เสื้อใน/ชุดชั้นใน</p>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-semibold mb-4">สินค้าแนะนำ</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <!-- Example Product Cards -->
                <a href="product.html" class="bg-white rounded-lg shadow-md p-2 hover:shadow-xl transition-shadow">
                    <img src="https://placehold.co/300x300/f5f5f5/333333?text=เสื้อเชิ้ต" alt="เสื้อเชิ้ตผู้ชาย" class="w-full h-auto rounded-lg">
                    <div class="p-2">
                        <h3 class="text-sm font-semibold truncate">เสื้อเชิ้ตแขนยาวสไตล์มินิมอล</h3>
                        <p class="text-orange-500 text-lg font-bold mt-1">฿250</p>
                        <div class="text-xs text-gray-500 mt-1 flex justify-between">
                            <span>ขายแล้ว 100+</span>
                            <span>กรุงเทพมหานคร</span>
                        </div>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-8 mt-12 text-center">
        <p>&copy; 2024 ร้านค้าเสื้อผ้า. สงวนลิขสิทธิ์.</p>
    </footer>

</body>
</html>
