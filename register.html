<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - FlauntFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }
        .flauntfit-brand-color {
            background-color: #FFC0CB; /* สีชมพู */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
        <div class="flex flex-col items-center">
            <a href="index.html" class="text-3xl font-bold mb-6 text-black">FlauntFit</a>
            <h2 class="text-2xl font-semibold mb-6 text-center">สมัครสมาชิก</h2>
        </div>
        <form action="#" method="POST">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">ชื่อผู้ใช้</label>
                <input type="text" id="username" name="username" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="ชื่อผู้ใช้">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">อีเมล</label>
                <input type="email" id="email" name="email" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="อีเมล">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">รหัสผ่าน</label>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" placeholder="รหัสผ่าน">
            </div>
            <div class="flex items-center justify-between mb-4">
                <button type="submit" class="flauntfit-brand-color text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline w-full">สมัครสมาชิก</button>
            </div>
        </form>
        <div class="text-center text-sm">
            <p>เป็นสมาชิกอยู่แล้วใช่ไหม? <a href="login.html" class="text-blue-500 hover:underline">เข้าสู่ระบบ</a></p>
        </div>
    </div>
</body>
</html>
